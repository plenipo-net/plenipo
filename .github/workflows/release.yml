name: release

# Publishes to npm when a version tag is pushed, through npm trusted publishing: GitHub proves the
# identity of this workflow to npm with OIDC, so no npm token is stored anywhere. The package must be
# configured on npmjs.com with this repository and this workflow file as its trusted publisher.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write   # to create the GitHub release
      id-token: write   # to prove this workflow's identity to npm
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: plenipo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      PLENIPO_TEST_PG_URL: postgres://postgres:plenipo@127.0.0.1:5432/postgres
      PLENIPO_TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: The tag matches package.json
        run: |
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME" \
            || { echo "tag $GITHUB_REF_NAME does not match package.json"; exit 1; }
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Skip npm if this version is already published
        id: npm
        run: |
          v="$(node -p "require('./package.json').version")"
          if npm view "plenipo@$v" version >/dev/null 2>&1; then
            echo "plenipo@$v is already on npm"; echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.npm.outputs.published != 'true'
        run: npm publish --access public
      - name: GitHub release with the notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## "v"( |$)" {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "Plenipo $v" --notes-file notes.md --verify-tag
