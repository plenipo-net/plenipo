# walt.id Wallet API 2 transaction data profiles, with the Plenipo mandate type added.
# The four first entries are walt.id's defaults (waltid-services/waltid-wallet-api2/config, October 2026).
# A request whose transaction_data type is not listed here is rejected by the wallet.
transactionDataProfiles = [
  {
    type = "org.waltid.transaction-data.payment-authorization"
    displayName = "Payment Authorization"
    fields = ["merchant_name", "amount", "currency"]
  },
  {
    type = "org.waltid.transaction-data.account-access"
    displayName = "Account Access"
    fields = ["account_identifier", "access_scope"]
  },
  {
    type = "urn:eudi:sca:payment:1"
    displayName = "SCA Payment"
    fields = ["payload"]
  },
  {
    type = "payment_card"
    displayName = "Payment Card"
    fields = ["merchant_name", "amount"]
  },
  {
    # Plenipo: a mandate for an AI agent, approved with the PID. The single field `mandate` holds the
    # mandate object (purpose, actions, counterparties, limits, nbf, exp, delegation, status, agent key).
    # The wallet hashes the transaction_data string as received into transaction_data_hashes of the
    # PID's KB-JWT; the verifier enforces exactly those bytes.
    type = "plenipo_mandate"
    displayName = "Mandate for an AI agent"
    fields = ["mandate"]
  },
  {
    # EUDI TS12 v1.0.1 section 4.3.4 E-mandate. Like the other TS12 types its details sit in `payload`:
    # transaction_id (required), date_time, start_date, end_date, reference_number, creditor_id,
    # purpose (required without payment_payload), payment_payload (a urn:eudi:sca:payment:1 object).
    # TS12 binds it to an SCA attestation of the account (not to the PID) and adds jti, amr and
    # response_mode to the KB-JWT. Plenipo does not produce or verify this type yet.
    type = "urn:eudi:sca:emandate:1"
    displayName = "E-mandate"
    fields = ["payload"]
  }
]
